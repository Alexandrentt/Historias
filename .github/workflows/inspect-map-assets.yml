name: Inspect map assets (temporary)

on:
  push:
    branches:
      - worldbuilding/geografia-y-terra

permissions:
  contents: write

jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: worldbuilding/geografia-y-terra
      - name: Inventory map components
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, json, gzip, zipfile, io
          sources=[]
          with zipfile.ZipFile("Historias_mapas_gz_GitHub.zip") as z:
            for info in z.infolist():
              if info.filename.lower().endswith(".map.gz"):
                sources.append((info.filename,gzip.decompress(z.read(info.filename))))
          sources.append(("Teknara.map.gz",gzip.decompress(pathlib.Path("Teknara.map.gz").read_bytes())))
          report=[]
          for name,raw in sources:
            lines=raw.decode("utf-8").splitlines()
            components=[]
            for i,line in enumerate(lines):
              if not line: continue
              item={"line":i+1,"length":len(line),"prefix":line[:110]}
              try:
                obj=json.loads(line)
                item["json_type"]=type(obj).__name__
                if isinstance(obj,dict):
                  item["keys"]=list(obj.keys())[:80]
                  item["key_count"]=len(obj)
                  for key in ["cells","vertices","features","cultures","states","burgs","rivers","religions","provinces","routes","markers","zones","notes"]:
                    if key in obj:
                      val=obj[key]
                      item[key+"_type"]=type(val).__name__
                      if isinstance(val,(list,dict)): item[key+"_count"]=len(val)
                elif isinstance(obj,list):
                  item["item_count"]=len(obj)
                  if obj and isinstance(obj[0],dict): item["first_item_keys"]=list(obj[0].keys())[:60]
              except Exception:
                if line.lstrip().startswith("<svg"): item["kind"]="svg"
                elif line.lstrip().startswith("<"): item["kind"]="xml_or_svg_fragment"
                else: item["kind"]="text"
              components.append(item)
            report.append({"file":name,"line_count":len(lines),"components":components})
          out=pathlib.Path("mapas-azgaar/datos/componentes-fuentes.json")
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps([{"file":x["file"],"components":[{"line":c["line"],"length":c["length"],"kind":c.get("kind"),"json_type":c.get("json_type"),"keys":c.get("keys"),"item_count":c.get("item_count")} for c in x["components"]]} for x in report],ensure_ascii=False,indent=2))
          PY
      - name: Commit component inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapas-azgaar/datos/componentes-fuentes.json
          git commit -m "Add map component inventory [skip ci]" || exit 0
          git push origin HEAD:worldbuilding/geografia-y-terra
